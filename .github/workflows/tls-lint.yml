name: TLS Config Lint
on:
  pull_request:
    branches: [main, master, dev, odh, incubating, stable-2.x]

permissions:
  contents: read
  security-events: write

jobs:
  tls-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: sebrandon1/tls-config-lint@a0d87d039a8d0c869c4bb535d013623eb93fa443 # v1
        id: lint
        with:
          severity-threshold: high
          sarif-output: tls-lint.sarif
          exclude-dirs: vendor,node_modules,test/fixtures

      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        if: always()
        with:
          sarif_file: tls-lint.sarif
