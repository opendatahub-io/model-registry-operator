name: API contract

# Static CRD compatibility check from red-hat-data-services/api-contract-tests.
# Compares the CRDs in a pull request with an immutable baseline commit and
# reports removed CRDs and API versions, served or storage-version changes,
# removed schema fields, newly required fields, type changes, enum narrowing
# and default changes. It does not replace conversion, admission or upgrade
# tests. See docs/api-contract-checks.md.
#
# Covered CRDs (generated by `make manifests`):
#   config/crd/bases/modelregistry.opendatahub.io_modelregistries.yaml
#   config/overlays/aihub/components.platform.opendatahub.io_aihubs.yaml
#   config/overlays/aihub/aihub.opendatahub.io_catalogs.yaml
#   config/overlays/catalog/aihub.opendatahub.io_catalogs.yaml
#
# The coverage job fails (once enforced) when a CRD manifest exists that the
# glob below does not match. internal/controller/testdata/crd holds mocked CRDs
# used as test data and is deliberately excluded.
#
# Two refs below are deliberate:
#   - the reusable workflow ref, the "latest" tag of api-contract-tests, which
#     follows the current release (v1.0.0 today), so new releases are adopted
#     without a change here; see docs/releasing.md in that repository.
#   - baseline-refs, the full commit SHA whose CRDs are the compatibility floor
#     (currently the v0.3.17 release). Move it forward only for an intentional
#     break that has been agreed, or list several commits (space-separated).
#
# Both jobs start in "report" mode (findings are annotated, the job stays
# green). Switch to "enforce" once the provider and consumers agree on the policy.

# Runs on every pull request targeting main, with no path filter, so a CRD added
# anywhere in the repository reaches the coverage job, and the checks can later
# be made required.

on:
  pull_request:
    branches: [main]

jobs:
  crd-contract:
    permissions:
      contents: read
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-crd-check.yml@latest
    with:
      crd-glob: config/*opendatahub.io_*.yaml
      baseline-refs: 86198eeb141169591f5ad3f6b294471f32456dab # v0.3.17
      mode: report

  crd-contract-coverage:
    permissions:
      contents: read
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-coverage-check.yml@latest
    with:
      crd-globs: config/*opendatahub.io_*.yaml
      crd-exclude-globs: internal/controller/testdata/crd/*
      yq-version: "4.45.1"
      mode: report
